version: '3.8'

networks:
  public_net:
  private_net:

volumes:
  wordpress_data:
  db_data:

services:
  db:
    image: mysql:8.0
    container_name: mysql_prod
    restart: always
    env_file:
      - .env
    networks:
      - private_net
    volumes:
      - db_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  php:
    image: wordpress:fpm-alpine
    container_name: wordpress_app_prod
    restart: always
    env_file:
      - .env
    networks:
      - private_net
    volumes:
      - wordpress_data:/var/www/html
    depends_on:
      - db
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  proxy:
    image: nginx
    container_name: nginx_proxy_prod
    restart: always
    ports:
      - "80:80" 
    networks:
      - public_net
      - private_net
    volumes:
      - ./proxy/nginx.conf:/etc/nginx/conf.d/default.conf
      - wordpress_data:/var/www/html
    depends_on:
      - php